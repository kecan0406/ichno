name: Release

# Pushing a v<version> tag publishes that version to npm. Authentication is npm trusted publishing (OIDC): the
# package's settings on npmjs.com trust this repository and this workflow file, so there is no token and no
# one-time password. Provenance is attached automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a publishing job — nothing restored from other runs ends up in the package.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      # prepublishOnly runs `pnpm check` first.
      - run: npm publish --access public
